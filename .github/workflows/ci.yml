name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Database Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: identity_verification_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d identity_verification_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Database Migrations (PostgreSQL)
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/identity_verification_test
        run: npm run migrate

      - name: Run Backend Unit, Integration & E2E Tests
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/identity_verification_test
        run: npm test

  ai-service-tests:
    name: AI Verification Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System OCR & Vision Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Service Test Suite
        working-directory: ./ai-service
        env:
          TF_USE_LEGACY_KERAS: '1'
        run: python tests/run_tests.py

  docker-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests, ai-service-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: verifyid-backend:test

      - name: Build AI Service Container
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: verifyid-ai-service:test

      - name: Docker Compose Runtime Smoke Test
        env:
          POSTGRES_PASSWORD: ci_test_password_123
          JWT_SECRET: ci_test_jwt_secret_key_32bytes_long_here
          PII_SALT: ci_test_pii_salt_cryptographic_secret
        run: |
          docker compose up -d --build
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            AI_RES=$(curl -s -f http://localhost:8001/health 2>/dev/null || true)
            BACKEND_RES=$(curl -s -f http://localhost:3000/api/health 2>/dev/null || true)
            if echo "$AI_RES" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' && \
               echo "$BACKEND_RES" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Services are healthy (status: ok)!"
              break
            fi
            sleep 2
          done
          # Verify AI health
          curl -f http://localhost:8001/health
          # Verify Backend health & connectivity
          curl -f http://localhost:3000/api/health
          # Verify Frontend is served
          curl -f -s http://localhost:3000/ | grep -i "Identity Verification"

          # Real End-to-End Verification Test through live Docker services
          echo "Executing real end-to-end verification through Docker Compose..."
          VERIFY_RES=$(curl -s -f -X POST http://localhost:3000/api/verify \
            -F "file=@backend/tests/fixtures/valid_id.png" \
            -F "registration_name=Rahul Sharma" \
            -F "event_code=HACK2026")
          echo "Verification response: $VERIFY_RES"

          echo "$VERIFY_RES" | grep -q '"decision"'
          echo "$VERIFY_RES" | grep -q '"confidence_score"'
          echo "$VERIFY_RES" | grep -q '"summary_reason"'
          echo "$VERIFY_RES" | grep -q '"requestId"'

          # Verify database record persisted in PostgreSQL container
          docker compose exec -T postgres psql -U verifyid_admin -d identity_verification -c "SELECT id, decision, confidence_score FROM verification_results LIMIT 1;" | grep -E "ELIGIBLE|REVIEW"

          docker compose down -v
